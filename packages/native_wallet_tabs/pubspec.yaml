publish_to: none
resolution: workspace
environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NativeWalletTabsPlugin
