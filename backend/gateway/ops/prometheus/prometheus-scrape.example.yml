scrape_configs:
  - job_name: kt-wallet-gateway
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/kt-wallet-gateway-metrics-token
    static_configs:
      - targets:
          - gateway.kt-wallet.com
        labels:
          environment: production

  - job_name: kt-wallet-prometheus
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9099
        labels:
          environment: production

rule_files:
  - kt-wallet-gateway-alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - 127.0.0.1:9098
