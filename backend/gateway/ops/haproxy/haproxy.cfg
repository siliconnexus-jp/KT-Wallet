global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option forwardfor
  # /rpc multiplexes read methods and the irreversible kt_broadcast write.
  # A proxy cannot safely infer whether an empty/timeout/5xx response happened
  # before or after the selected Gateway forwarded signed bytes. Never replay
  # a request to the other instance; Gateway owns read-side RPC failover.
  retries 0
  timeout connect 1s
  timeout client 125s
  timeout server 125s
  timeout http-request 15s

frontend ktwallet_gateway_in
  bind 127.0.0.1:8118
  default_backend ktwallet_gateways

backend ktwallet_gateways
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 1s fastinter 250ms downinter 1s fall 2 rise 2
  server primary 127.0.0.1:8119 check
  server secondary 127.0.0.1:8120 check
